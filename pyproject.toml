[project]
dynamic = ["version"]

name = "cvat-mcp"
description = "MCP server that lets an AI assistant review annotations in CVAT"
readme = "README.md"
authors = [{name = "Evgenii Strakhov"}]
requires-python = ">=3.12"
dependencies = [
    "cvat-sdk==2.83.0",

    "mcp>=2.3,<3",
    "Pillow>=10.3.0",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.scripts]
cvat-mcp = "cvat_mcp.__main__:main"

[dependency-groups]
dev = [
    "black==26.*",
    "isort==7.*",
    "pre-commit",
    "pylint==4.0.9",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "cvat_mcp.__version__"}

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
forced_separate = ["tests"]
line_length = 100
skip_gitignore = true # align tool behavior with Black

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
