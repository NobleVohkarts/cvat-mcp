# Run from the repository root:
#   uv run pre-commit run --all-files
# Local hooks reuse the versions locked in uv.lock.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        files: \.py$
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        files: \.py$
      - id: pylint
        name: pylint
        entry: uv run pylint --rcfile=.pylintrc
        language: system
        files: \.py$
        require_serial: true  # one process: .pylintrc already parallelises (jobs=0)
